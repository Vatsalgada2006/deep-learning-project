name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx anyio pytest-asyncio

      - name: Run pytest test suite
        run: |
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Build & Healthcheck Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f backend/Dockerfile -t road-accident-detection-api:test .

      - name: Run container and verify /health returns 200
        run: |
          echo "Starting container with --memory=512m -e PORT=10000..."
          docker run -d --name api-test --memory=512m -e PORT=10000 -p 10000:10000 road-accident-detection-api:test

          echo "Waiting for /health to respond with 200 OK..."
          timeout=30
          counter=0
          until curl -s -f http://localhost:10000/health; do
            if [ $counter -ge $timeout ]; then
              echo "Error: Container healthcheck timed out after ${timeout}s!"
              echo "=== Container Logs ==="
              docker logs api-test
              docker stop api-test
              exit 1
            fi
            echo "Waiting for /health (attempt $counter)..."
            sleep 1
            counter=$((counter + 1))
          done

          echo ""
          echo "Healthcheck response verified successfully:"
          curl -s http://localhost:10000/health | jq . || curl -s http://localhost:10000/health
          echo "=== Container Logs ==="
          docker logs api-test
          docker stop api-test
