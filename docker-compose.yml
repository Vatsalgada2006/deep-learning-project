# Road Accident Detection System - Local Docker Compose
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:10000"
    environment:
      - PORT=10000
      - HOST=0.0.0.0
      - MODEL_PATH=/app/model.onnx
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=accident_detection
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - DEMO_MODE=false
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: